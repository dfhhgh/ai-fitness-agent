[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fitness-agent"
version = "0.1.0"
description = "Deterministic AI Fitness Platform Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4.21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0,<22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not integration'"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
markers = [
    "integration: mark test as remote integration test (deselected by default)",
]
asyncio_mode = "auto"

